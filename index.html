    {
        "imports": {

            "lucide-react": "https://esm.sh/lucide-react@0.330.0?deps=react@18.2.0",
            "recharts": "https://esm.sh/recharts@2.12.0?deps=react@18.2.0,react-dom@18.2.0,prop-types@15.8.1,react-is@18.2.0",

<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          Thermometer, CloudRain, Sun, Snowflake, AlertTriangle, MapPin, 
          TrendingUp, TrendingDown, Minus, Search, Download, Flag, Info, X, PlusCircle, Star
        } from 'lucide-react';
        import { 
          ResponsiveContainer, ComposedChart, CartesianGrid, XAxis, YAxis, Tooltip as RechartsTooltip, 
          Legend, Line, Bar
        } from 'recharts';
        import html2canvas from 'html2canvas';

        const BEET_STAGES = [
          { name: 'Levée', gdd: 120 },
          { name: '2 Feuilles', gdd: 250 },
          { name: '4 Feuilles', gdd: 350 },
          { name: '6 Feuilles', gdd: 450 },
          { name: 'Fermeture des rangs', gdd: 1000 }
        ];

        const exportChartAsPNG = (containerId, fileName) => {
          const container = document.getElementById(containerId);
          if (!container) return;
          
          // Masquer temporairement le bouton de téléchargement pour la photo
          const btn = container.querySelector('button');
          if (btn) btn.style.display = 'none';
          
          html2canvas(container, {
            scale: 2, // Haute résolution
            backgroundColor: '#ffffff'
          }).then(canvas => {
            if (btn) btn.style.display = ''; // Réafficher le bouton
            const a = document.createElement("a");
            a.download = fileName + ".png";
            a.href = canvas.toDataURL("image/png");
            a.click();
          }).catch(err => {
            if (btn) btn.style.display = '';
            console.error("Erreur html2canvas:", err);
          });
        };

        const getPastDate = (daysAgo) => {
          const date = new Date();
          date.setDate(date.getDate() - daysAgo);
          return date.toISOString().split('T')[0];
        };

        const getFutureDate = (daysAhead) => {
          const date = new Date();
          date.setDate(date.getDate() + daysAhead);
          return date.toISOString().split('T')[0];
        };

        const getDefaultSowingDate = () => {
          const date = new Date();
          date.setMonth(2); // Mars
          date.setDate(15);
          return date.toISOString().split('T')[0];
        };

        const checkSowingDateValid = (dateString) => {
          if (!dateString) return false;
          const date = new Date(dateString);
          const month = date.getMonth() + 1;
          const day = date.getDate();
          if (month === 2 && day >= 15) return true;
          if (month === 3 || month === 4) return true;
          if (month === 5 && day <= 15) return true;
          return false;
        };

        const fetchOpenMeteo = async (url) => {
          // Système de Cache
          const cacheKey = `agro_cache_${url}`;
          const cached = sessionStorage.getItem(cacheKey);
          if (cached) {
            const parsed = JSON.parse(cached);
            // Expire après 2 heures
            if (Date.now() - parsed.timestamp < 7200000) return parsed.data;
          }

          const res = await fetch(url);
          const json = await res.json();
          if (json.error) throw new Error(`API Météo: ${json.reason}`);
          if (!res.ok) throw new Error(`Erreur réseau (${res.status})`);
          
          sessionStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data: json }));
          return json;
        };

        const fetchOpenMeteoStitched = async (lat, lon, start, end) => {
          const today = new Date();
          const archiveBoundary = new Date(today);
          archiveBoundary.setDate(today.getDate() - 5); 
          const archiveEndStr = archiveBoundary.toISOString().split('T')[0];
          
          const startD = new Date(start);
          const endD = new Date(end);
          
          let archData = null;
          let foreData = null;
          
          if (startD <= archiveBoundary) {
            const fetchEnd = endD < archiveBoundary ? end : archiveEndStr;
            const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${start}&end_date=${fetchEnd}&hourly=temperature_2m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,shortwave_radiation_sum,et0_fao_evapotranspiration&timezone=Europe/Paris`;
            archData = await fetchOpenMeteo(url);
          }
          
          if (endD > archiveBoundary) {
            const fetchStart = startD > archiveBoundary ? start : getPastDate(4);
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&start_date=${fetchStart}&end_date=${end}&hourly=temperature_2m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,shortwave_radiation_sum,et0_fao_evapotranspiration&timezone=Europe/Paris`;
            foreData = await fetchOpenMeteo(url);
          }
          
          if (archData && !foreData) return archData;
          if (!archData && foreData) return foreData;
          
          const mergedDaily = {};
          Object.keys(archData.daily).forEach(key => {
            mergedDaily[key] = [...archData.daily[key], ...foreData.daily[key]];
          });
          
          const mergedHourly = {};
          Object.keys(archData.hourly).forEach(key => {
            mergedHourly[key] = [...archData.hourly[key], ...foreData.hourly[key]];
          });
          
          return {
            latitude: archData.latitude,
            longitude: archData.longitude,
            elevation: archData.elevation,
            daily: mergedDaily,
            hourly: mergedHourly
          };
        };

        function AgroMeteoApp() {
          const [isCompareMode, setIsCompareMode] = useState(false);
          
          const [cityQuery1, setCityQuery1] = useState('Amiens (Hauts-de-France)');
          const [locName1, setLocName1] = useState('Amiens (Hauts-de-France)');
          const [lat1, setLat1] = useState('49.894');
          const [lon1, setLon1] = useState('2.295');
          const [stationInfo1, setStationInfo1] = useState(null);
          
          const [cityQuery2, setCityQuery2] = useState('Reims (Grand Est)');
          const [locName2, setLocName2] = useState('Reims (Grand Est)');
          const [lat2, setLat2] = useState('49.258');
          const [lon2, setLon2] = useState('4.031');
          const [stationInfo2, setStationInfo2] = useState(null);

          const [searchResults, setSearchResults] = useState([]);
          const [activeSearchIdx, setActiveSearchIdx] = useState(null);

          const [savedSites, setSavedSites] = useState(() => {
            try {
              const item = window.localStorage.getItem('agrometeo_saved_sites');
              return item ? JSON.parse(item) : [];
            } catch (error) {
              return [];
            }
          });

          const [startDate, setStartDate] = useState(getDefaultSowingDate());
          const [endDate, setEndDate] = useState(getFutureDate(7));
          
          const [comparisonPeriod, setComparisonPeriod] = useState('1991-2020');
          const [tempType, setTempType] = useState('mean'); 

          const [apiData, setApiData] = useState(null);
          const [loading, setLoading] = useState(false);
          const [error, setError] = useState(null);
          
          const [metrics1, setMetrics1] = useState(null);
          const [metrics2, setMetrics2] = useState(null);
          const [refMetrics, setRefMetrics] = useState(null);
          
          const [stageMetrics, setStageMetrics] = useState([]);
          const [monthlyChartData, setMonthlyChartData] = useState([]);
          const [dailyChartData, setDailyChartData] = useState([]);

          const toggleSaveSite = () => {
            const isCurrentlySaved = savedSites.some(site => site.lat === lat1 && site.lon === lon1);
            let newSites;
            if (isCurrentlySaved) {
              newSites = savedSites.filter(site => !(site.lat === lat1 && site.lon === lon1));
            } else {
              newSites = [...savedSites, { name: locName1.split(' (')[0], fullName: locName1, lat: lat1, lon: lon1 }];
            }
            setSavedSites(newSites);
            window.localStorage.setItem('agrometeo_saved_sites', JSON.stringify(newSites));
          };

          const loadSavedSite = (site) => {
            setLat1(site.lat);
            setLon1(site.lon);
            setCityQuery1(site.fullName);
            setLocName1(site.fullName);
          };

          const handleSearchInput = async (query, stationIdx) => {
            if (stationIdx === 1) setCityQuery1(query);
            else setCityQuery2(query);
            
            if (query.length < 3) {
              setSearchResults([]);
              setActiveSearchIdx(null);
              return;
            }
            
            setActiveSearchIdx(stationIdx);
            try {
              const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=5&language=fr&format=json`);
              const data = await res.json();
              if (data.results) setSearchResults(data.results);
            } catch (err) {
              console.error("Erreur géocodage", err);
            }
          };

          const selectCity = (city, stationIdx) => {
            const fullName = `${city.name} (${city.admin1 || city.country})`;
            if (stationIdx === 1) {
              setLat1(city.latitude.toString());
              setLon1(city.longitude.toString());
              setCityQuery1(fullName);
              setLocName1(fullName);
            } else {
              setLat2(city.latitude.toString());
              setLon2(city.longitude.toString());
              setCityQuery2(fullName);
              setLocName2(fullName);
            }
            setSearchResults([]);
            setActiveSearchIdx(null);
          };

          const fetchWeatherData = async () => {
            setLoading(true);
            setError(null);
            
            try {
              let promises = [fetchOpenMeteoStitched(lat1, lon1, startDate, endDate)];
              if (isCompareMode) promises.push(fetchOpenMeteoStitched(lat2, lon2, startDate, endDate));
              else promises.push(Promise.resolve(null)); 

              const startD = new Date(startDate);
              const endD = new Date(endDate);
              const currentYear = startD.getFullYear();
              let refPromises = [];

              if (comparisonPeriod === 'n-1') {
                const pS = new Date(startD.setFullYear(startD.getFullYear() - 1)).toISOString().split('T')[0];
                const pE = new Date(endD.setFullYear(endD.getFullYear() - 1)).toISOString().split('T')[0];
                refPromises.push(fetchOpenMeteo(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat1}&longitude=${lon1}&start_date=${pS}&end_date=${pE}&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,shortwave_radiation_sum,et0_fao_evapotranspiration&timezone=Europe/Paris`));
              } else if (comparisonPeriod === '1991-2020') {
                refPromises.push(fetchOpenMeteo(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat1}&longitude=${lon1}&start_date=1991-01-01&end_date=2005-12-31&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,shortwave_radiation_sum,et0_fao_evapotranspiration&timezone=Europe/Paris`));
                refPromises.push(fetchOpenMeteo(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat1}&longitude=${lon1}&start_date=2006-01-01&end_date=2020-12-31&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,shortwave_radiation_sum,et0_fao_evapotranspiration&timezone=Europe/Paris`));
              } else {
                const years = parseInt(comparisonPeriod, 10);
                refPromises.push(fetchOpenMeteo(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat1}&longitude=${lon1}&start_date=${currentYear - years}-01-01&end_date=${currentYear - 1}-12-31&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,shortwave_radiation_sum,et0_fao_evapotranspiration&timezone=Europe/Paris`));
              }

              const results = await Promise.all([...promises, ...refPromises]);
              const data1 = results[0];
              const data2 = results[1];
              const refDataArray = results.slice(2);

              setStationInfo1({ lat: data1.latitude, lon: data1.longitude, elevation: data1.elevation });
              if (data2) setStationInfo2({ lat: data2.latitude, lon: data2.longitude, elevation: data2.elevation });

              setApiData({ current1: data1, current2: data2, ref: refDataArray, compPeriod: comparisonPeriod });

            } catch (err) {
              setError(`Erreur de connexion Météo : ${err.message}.`);
            } finally {
              setLoading(false);
            }
          };

          useEffect(() => {
            if (!apiData) return;
            try {
              const { current1, current2, ref, compPeriod } = apiData;
              const activeTempKey = `temperature_2m_${tempType}`;

              const refStats = {};
              if (compPeriod === 'n-1' && ref[0] && ref[0].daily) {
                const pData = ref[0].daily;
                for (let i = 0; i < pData.time.length; i++) {
                  refStats[pData.time[i].substring(5)] = { 
                    temp: pData[activeTempKey][i], 
                    rain: pData.precipitation_sum[i],
                    rad: pData.shortwave_radiation_sum[i],
                    et0: pData.et0_fao_evapotranspiration[i]
                  };
                }
              } else if (ref.length > 0) {
                const tempAgg = {};
                ref.forEach(res => {
                  if (!res || !res.daily) return;
                  for (let i = 0; i < res.daily.time.length; i++) {
                    const mmdd = res.daily.time[i].substring(5);
                    if (!tempAgg[mmdd]) tempAgg[mmdd] = { temp: [], rain: [], rad: [], et0: [] };
                    const t = res.daily[activeTempKey][i];
                    const r = res.daily.precipitation_sum[i];
                    const rad = res.daily.shortwave_radiation_sum[i];
                    const et0 = res.daily.et0_fao_evapotranspiration[i];
                    if (t !== null && t !== undefined) tempAgg[mmdd].temp.push(t);
                    if (r !== null && r !== undefined) tempAgg[mmdd].rain.push(r);
                    if (rad !== null && rad !== undefined) tempAgg[mmdd].rad.push(rad);
                    if (et0 !== null && et0 !== undefined) tempAgg[mmdd].et0.push(et0);
                  }
                });
                for (const [mmdd, vals] of Object.entries(tempAgg)) {
                  refStats[mmdd] = {
                    temp: vals.temp.length > 0 ? vals.temp.reduce((a,b)=>a+b,0) / vals.temp.length : null,
                    rain: vals.rain.length > 0 ? vals.rain.reduce((a,b)=>a+b,0) / vals.rain.length : 0,
                    rad: vals.rad.length > 0 ? vals.rad.reduce((a,b)=>a+b,0) / vals.rad.length : null,
                    et0: vals.et0.length > 0 ? vals.et0.reduce((a,b)=>a+b,0) / vals.et0.length : null
                  };
                }
              }

              const processMetrics = (data) => {
                if (!data) return null;
                let rain = 0, gdd0 = 0, gdd6 = 0, days25 = 0, days0 = 0, vern = 0, devern = 0, sumT = 0, countT = 0;
                for (let i = 0; i < data.daily.time.length; i++) {
                  const currT = data.daily[activeTempKey][i];
                  const tmax = data.daily.temperature_2m_max[i];
                  const tmin = data.daily.temperature_2m_min[i];
                  const r = data.daily.precipitation_sum[i];

                  if (currT !== null) {
                    gdd0 += Math.max(0, currT - 0);
                    gdd6 += Math.max(0, currT - 6);
                    sumT += currT; countT++;
                  }
                  if (r !== null) rain += r;
                  if (tmax > 25) days25++;
                  if (tmin < 0) days0++;
                  
                  if (i <= 90 && tmin < 5) vern++;
                  if (i >= 60 && i <= 120 && tmax > 25) devern++;
                }
                return { 
                  rain: Math.round(rain * 10) / 10, gdd0: Math.round(gdd0), gdd6: Math.round(gdd6), 
                  days25, days0, vern, devern, 
                  avgTemp: countT > 0 ? (Math.round((sumT / countT) * 10) / 10) : 0 
                };
              };

              const m1 = processMetrics(current1);
              setMetrics1(m1);
              if (current2) setMetrics2(processMetrics(current2));

              let sumRefRain = 0, sumRefGdd0 = 0, sumRefGdd6 = 0, sumRefT = 0, countRefT = 0;
              
              for (let i = 0; i < current1.daily.time.length; i++) {
                const mmdd = current1.daily.time[i].substring(5);
                const refDay = refStats[mmdd];
                
                if (refDay) {
                  if (refDay.temp !== null) {
                    sumRefGdd0 += Math.max(0, refDay.temp - 0);
                    sumRefGdd6 += Math.max(0, refDay.temp - 6);
                    sumRefT += refDay.temp; countRefT++;
                  }
                  if (refDay.rain !== null && refDay.rain !== undefined) sumRefRain += refDay.rain;
                }
              }
              
              setRefMetrics({
                rain: Math.round(sumRefRain * 10) / 10,
                gdd0: Math.round(sumRefGdd0),
                gdd6: Math.round(sumRefGdd6),
                avgTemp: countRefT > 0 ? (Math.round((sumRefT / countRefT) * 10) / 10) : 0
              });

              const combinedDaily = [];
              const monthlyMap = {};
              const monthNames = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil", "Aoû", "Sep", "Oct", "Nov", "Déc"];
              let cGdd1 = 0, cGdd2 = 0, cGddRef = 0;

              for (let i = 0; i < current1.daily.time.length; i++) {
                const dateStr = current1.daily.time[i];
                const yyyy = dateStr.substring(0, 4);
                const mmdd = dateStr.substring(5);
                const mm = parseInt(mmdd.substring(0, 2), 10) - 1;
                const yearMonthKey = `${yyyy}-${mmdd.substring(0, 2)}`;
                
                const t1 = current1.daily[activeTempKey][i];
                const r1 = current1.daily.precipitation_sum[i];
                const t2 = current2 ? current2.daily[activeTempKey][i] : null;
                const r2 = current2 ? current2.daily.precipitation_sum[i] : null;
                const refDay = refStats[mmdd] || { temp: null, rain: 0, rad: null, et0: null };

                if (t1 !== null) cGdd1 += Math.max(0, t1);
                if (t2 !== null) cGdd2 += Math.max(0, t2);
                if (refDay.temp !== null) cGddRef += Math.max(0, refDay.temp);

                const rad1 = current1.daily.shortwave_radiation_sum[i];
                const rad2 = current2 ? current2.daily.shortwave_radiation_sum[i] : null;
                const et01 = current1.daily.et0_fao_evapotranspiration[i];
                const et02 = current2 ? current2.daily.et0_fao_evapotranspiration[i] : null;

                // Regroupement par Année + Mois pour éviter le mélange en cas d'années croisées
                if (!monthlyMap[yearMonthKey]) {
                  monthlyMap[yearMonthKey] = { 
                    sortKey: yearMonthKey,
                    monthName: `${monthNames[mm]} ${yyyy}`, 
                    r1: 0, r2: 0, rRef: 0,
                    rad1: 0, rad2: 0, radRef: 0,
                    et01: 0, et02: 0, et0Ref: 0
                  };
                }
                
                if (r1 !== null) monthlyMap[yearMonthKey].r1 += r1;
                if (r2 !== null) monthlyMap[yearMonthKey].r2 += r2;
                monthlyMap[yearMonthKey].rRef += (refDay.rain || 0);

                if (rad1 !== null) monthlyMap[yearMonthKey].rad1 += rad1;
                if (rad2 !== null) monthlyMap[yearMonthKey].rad2 += rad2;
                if (refDay.rad != null) monthlyMap[yearMonthKey].radRef += refDay.rad;

                if (et01 !== null) monthlyMap[yearMonthKey].et01 += et01;
                if (et02 !== null) monthlyMap[yearMonthKey].et02 += et02;
                if (refDay.et0 != null) monthlyMap[yearMonthKey].et0Ref += refDay.et0;

                combinedDaily.push({
                  date: dateStr,
                  temp1: t1 !== null ? Math.round(t1 * 10) / 10 : null,
                  temp2: t2 !== null ? Math.round(t2 * 10) / 10 : null,
                  refTemp: refDay.temp !== null ? Math.round(refDay.temp * 10) / 10 : null,
                  rain1: r1 !== null ? Math.round(r1 * 10) / 10 : 0,
                  rain2: r2 !== null ? Math.round(r2 * 10) / 10 : 0,
                  gdd1: Math.round(cGdd1),
                  gdd2: Math.round(cGdd2),
                  gddRef: Math.round(cGddRef),
                  rad1: rad1 !== null ? Math.round(rad1 * 10) / 10 : null,
                  rad2: rad2 !== null ? Math.round(rad2 * 10) / 10 : null,
                  radRef: refDay.rad != null ? Math.round(refDay.rad * 10) / 10 : null,
                  et01: et01 !== null ? Math.round(et01 * 10) / 10 : null,
                  et02: et02 !== null ? Math.round(et02 * 10) / 10 : null,
                  et0Ref: refDay.et0 != null ? Math.round(refDay.et0 * 10) / 10 : null
                });
              }

              setDailyChartData(combinedDaily);
              setMonthlyChartData(Object.values(monthlyMap).sort((a,b) => a.sortKey.localeCompare(b.sortKey)).map(m => ({
                month: m.monthName,
                Pluie_Stat1: Math.round(m.r1 * 10) / 10,
                Pluie_Stat2: Math.round(m.r2 * 10) / 10,
                Pluie_Ref: Math.round(m.rRef * 10) / 10,
                rad1: Math.round(m.rad1 * 10) / 10,
                rad2: Math.round(m.rad2 * 10) / 10,
                radRef: Math.round(m.radRef * 10) / 10,
                et01: Math.round(m.et01 * 10) / 10,
                et02: Math.round(m.et02 * 10) / 10,
                et0Ref: Math.round(m.et0Ref * 10) / 10
              })));

              setStageMetrics(BEET_STAGES.map(stage => {
                const curDay = combinedDaily.find(d => d.gdd1 >= stage.gdd);
                let cmpDay = null;
                if (isCompareMode) cmpDay = combinedDaily.find(d => d.gdd2 >= stage.gdd);
                else cmpDay = combinedDaily.find(d => d.gddRef >= stage.gdd);
                
                let diffDays = null;
                if (curDay && cmpDay) diffDays = Math.round((new Date(curDay.date) - new Date(cmpDay.date)) / 86400000);
                return { name: stage.name, gdd: stage.gdd, date1: curDay ? curDay.date : null, dateCmp: cmpDay ? cmpDay.date : null, diffDays };
              }));

            } catch(e) {
              setError("Erreur lors du traitement des données: " + e.message);
            }
